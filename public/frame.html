<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Document</title>
  <style>
    *{
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    #root {
      position: absolute;
      margin: 0 auto;
      width: 100%;
      height: 100%;
      text-align: center;
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }
    .title {
        position: absolute;
        letter-spacing: -1px;
        text-align: center;
        display: inline-block;
        word-break: keep-all;
    }
    .mainImage {
        position: absolute;
        min-width: 25%;
        min-height: 30px;
        max-width: 100%;
        max-height: 100%;
        background-position: center;
        background-repeat: no-repeat;
        background-size: contain;
    }
    .image {
      position: absolute;
      min-width: 25%;
      min-height: 30px;
      max-width: 100%;
      max-height: 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
    }
    .text {
      position: absolute;
      letter-spacing: -1px;
      text-align: center;
      display: inline-block;
      word-break: keep-all;
    }
    .button {
      position: absolute;
      padding: 8px 16px;
      font-weight: bold;
      white-space: nowrap;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/javascript">
    //아쉬운대로 로컬스토리지에서 데이터 가져오기
    const createData = localStorage.getItem('frameData')
    //기본 소재 기본값
    const baseData = JSON.parse(createData)
    const subData = baseData.row.find(item => item.size === window.name)
    const root = document.querySelector("#root")
    //공장화
    function factory (name) {
      const div = document.createElement('div')
      div.className = name
      if(!['mainImage','text','image'].includes(name)){
        div.innerText = baseData[name].text
      }
      if(['mainImage','title','button'].includes(name)){
        //포지션
        Object.entries(subData[name]).map(function (item) {
          div.style[item[0]] = item[1] + 'px'
        })
        //기본 스타일
        Object.entries(baseData[name]).map(function (item) {
          if(name === 'button') {
            div.style.border = baseData[name].backgroundColor === baseData['background'].backgroundColor ? '1px solid #aaa' : null
          }
          if(name !== 'mainImage'){
            if(item[0] !== 'text'){
              div.style[item[0]] = isNaN(item[1]) ? item[1] : item[1]+'px'
            }
          } else {
            if(item[0] === 'url') {
              div.style.backgroundImage = `url(${item[1]})`
            }
          }
        })
        root.appendChild(div)
      } else {
        // 추가된 텍스트, 이미지
        subData[name].map(function (datum,i) {
          const div = document.createElement('div')
          div.className = name
          div.innerText = typeof datum === 'string' ? datum : null
          Object.entries(subData[name+i]).map(function (css) {
            div.style[css[0]] = isNaN(css[1]) ? css[1] : css[1]+'px'
          })
          div.style.backgroundImage = `url(${datum.url})`
          div.style.color = baseData.title.color
          div.style.fontSize = '14px'
          root.appendChild(div)
        })
      }
    }
    // 일반 함수
    function init() {
      root.style.background = baseData.background.backgroundImage !== '' ? `url(${baseData.background.backgroundImage})`: baseData.background.backgroundColor
      const elementArray = ['mainImage','title','text','button','image'].map(function (item) {
        factory(item)
      })
    }
    //방어로직
    if(subData !== undefined){
      init()
    } else {
      const div = document.createElement('div')
      div.innerText = "데이터가 없습니다."
      div.style.display = 'flex'
      div.style.justifyContent = 'center'
      div.style.alignItems = 'center'
      div.style.height = '100%'
      div.style.backgroundColor = '#fff'
      root.appendChild(div)
    }
    root.addEventListener('click', function () {
      console.log('클릭이벤트')
      window.open('about:blank').location.href = baseData.pcUrl
    })
  </script>
</body>
</html>

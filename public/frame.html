  const root = document.querySelector("#root")

  //공장화
  function factory (name) {
    const div = document.createElement('div')
    div.className = name
    if(!['mainImage','text','image'].includes(name)){
      div.innerText = baseData[name].text
    }
    if(['mainImage','title','button'].includes(name)){
      //크기조절
      Object.entries(subData[name]).map(function (item) {
        console.log(name, item)
        div.style[item[0]] = item[1] + 'px'
      })
      //스타일
      Object.entries(baseData[name]).map(function (item) {
        if(name !== 'mainImage'){
          if(item[0] !== 'text'){
            div.style[item[0]] = isNaN(item[1]) ? item[1] : item[1]+'px'
          }
        } else {
          if(item[0] === 'url') {
            div.style.backgroundImage = `url(${item[1]})`
          }
        }
      })
      root.appendChild(div)
    } else {
      subData[name].map(function (datum,i) {
        const div = document.createElement('div')
        div.className = name
        div.innerText = typeof datum === 'string' ? datum : null
        Object.entries(subData[name+i]).map(function (css) {
          div.style[css[0]] = isNaN(css[1]) ? css[1] : css[1]+'px'
        })
        div.style.backgroundImage = `url(${datum.url})`
        div.style.color = baseData.title.color
        div.style.fontSize = '14px'
        root.appendChild(div)
      })
    }
  }

  function init() {
    root.style.background = baseData.background.backgroundImage !== '' ? `url(${baseData.background.backgroundImage})`: baseData.background.backgroundColor
    const elementArray = ['mainImage','title','text','button','image'].map(function (item) {
      factory(item)
    })
  }

  init()

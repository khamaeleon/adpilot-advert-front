  const root = document.querySelector("#root")

  function title () {
    const mainTitle = document.createElement('div')
    mainTitle.className = 'title'
    mainTitle.innerText = baseData.title
    mainTitle.style.left = subData.title.x + 'px'
    mainTitle.style.top = subData.title.y + 'px'
    mainTitle.style.color = baseData.titleColor
    mainTitle.style.fontSize = baseData.titleSize + 'px'
    mainTitle.style.fontFamily = baseData.titleFamily
    mainTitle.style.fontWeight = baseData.titleBold && 'bold'
    mainTitle.style.fontStyle = baseData.titleItalic && 'italic'
    mainTitle.style.textDecoration = baseData.titleUnderline && 'underline'
    root.appendChild(mainTitle)
  }
  function mainImage () {
    const mainImage = document.createElement('div')
    mainImage.className = 'image'
    mainImage.style.left = subData.mainImage.x + 'px'
    mainImage.style.top = subData.mainImage.y + 'px'
    mainImage.style.width = subData.mainImage.w + 'px'
    mainImage.style.height = subData.mainImage.h + 'px'
    mainImage.style.backgroundImage = `url(${baseData.mainImage.url})`
    root.appendChild(mainImage)
  }
  function text () {
    subData.text.map(function (text,i) {
      const textDiv = document.createElement('div')
      textDiv.className = 'text'
      textDiv.innerText = text
      textDiv.style.left = subData[`text${i}`].x + 'px'
      textDiv.style.top = subData[`text${i}`].y + 'px'
      textDiv.style.color = baseData.titleColor
      textDiv.style.fontSize = '12px'
      root.appendChild(textDiv)
    })
  }

  function subImage () {
    subData.image.map(function (img,i) {
      console.log(img.url)
      const imageDiv = document.createElement('div')
      imageDiv.className = 'image'
      imageDiv.style.left = subData[`image${i}`].x + 'px'
      imageDiv.style.top = subData[`image${i}`].y + 'px'
      imageDiv.style.width = subData[`image${i}`].w + 'px'
      imageDiv.style.height = subData[`image${i}`].h + 'px'
      imageDiv.style.backgroundImage = `url(${img.url})`
      root.appendChild(imageDiv)
    })
  }

  function button () {
    const button = document.createElement('button')
    button.type = 'button'
    button.className = 'button'
    button.innerText = baseData.buttonTitle
    button.style.left = subData.button.x + 'px'
    button.style.top = subData.button.y + 'px'
    button.style.color = baseData.buttonColor
    button.style.backgroundColor = baseData.buttonBackgroundColor
    root.appendChild(button)
  }
  function init() {
    root.style.background = baseData.backgroundImage !== '' ? `url(${baseData.backgroundImage})`: baseData.backgroundColor
    mainImage()
    subImage()
    title()
    text()
    button()
  }

  init()
</script>
